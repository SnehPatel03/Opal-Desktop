name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    env:
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production configuration
        shell: bash
        run: |
          test -n "$VITE_SOCKET_URL" || { echo "::error::Set the VITE_SOCKET_URL Actions variable."; exit 1; }
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "::error::Set the VITE_CLERK_PUBLISHABLE_KEY Actions variable."; exit 1; }
          node --input-type=module -e 'const url = new URL(process.env.VITE_SOCKET_URL); if (url.protocol !== "https:") throw new Error("VITE_SOCKET_URL must use HTTPS in production.");'
      - run: npm ci
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No desktop installers were produced."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
